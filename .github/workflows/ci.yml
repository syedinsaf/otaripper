name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Cargo Check
        run: cargo check --all-targets --target ${{ matrix.target }}

      - name: Run Unit Tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build Full Binary (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Lite Binary (Release, no default features)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Dependabot PR Failure Hint
        if: failure() && github.actor == 'dependabot[bot]'
        shell: bash
        run: |
          echo "### ⚠️ Dependabot Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "One of the updated crates in this PR failed to compile or pass tests." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **To drop a broken crate and keep the working ones, comment on the PR:**" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "@dependabot ignore <crate_name>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Dependabot will immediately recreate the PR excluding that crate." >> $GITHUB_STEP_SUMMARY
